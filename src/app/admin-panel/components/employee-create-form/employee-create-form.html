<section class="employee-create-form">
  <header class="employee-create-form__header">
    <h3 class="employee-create-form__title">Crear empleado</h3>
    <p class="employee-create-form__description">
      Alta rápida para personal interno con rol inicial y credenciales.
    </p>
  </header>

  <div class="employee-create-form__grid">
    <label class="employee-create-form__field">
      Usuario
      <input
        class="employee-create-form__input"
        type="text"
        maxlength="40"
        placeholder="usuario"
        [value]="username"
        (input)="usernameInput.emit($event)"
      />
    </label>

    <label class="employee-create-form__field">
      Email
      <input
        class="employee-create-form__input"
        type="email"
        maxlength="120"
        placeholder="empleado@arena.local"
        [value]="email"
        (input)="emailInput.emit($event)"
      />
    </label>
  </div>

  <div class="employee-create-form__grid">
    <label class="employee-create-form__field">
      Contraseña
      <input
        class="employee-create-form__input"
        type="password"
        maxlength="64"
        autocomplete="new-password"
        placeholder="Mín. 8, mayúscula y especial"
        [value]="password"
        (input)="passwordInput.emit($event)"
      />
    </label>

    <label class="employee-create-form__field">
      Rol inicial
      <div class="employee-create-form__select-wrap">
        <select
          class="employee-create-form__input employee-create-form__select"
          [value]="role"
          (change)="roleChange.emit($event)"
        >
          <option value="admin">Admin</option>
          <option value="client">Empleado</option>
        </select>
      </div>
    </label>
  </div>

  <div class="employee-create-form__permissions">
    <div class="employee-create-form__permissions-header">
      <span class="employee-create-form__permissions-title">Permisos</span>
      <div class="employee-create-form__permissions-actions">
        <button
          type="button"
          class="employee-create-form__permissions-toggle"
          (click)="selectAll()"
        >
          Todos
        </button>
        <button type="button" class="employee-create-form__permissions-toggle" (click)="clearAll()">
          Ninguno
        </button>
      </div>
    </div>

    <div class="employee-create-form__permissions-list">
      @for (perm of allPermissions; track perm) {
        <label class="employee-create-form__permission-item">
          <input
            type="checkbox"
            class="employee-create-form__permission-checkbox"
            [checked]="isChecked(perm)"
            (change)="togglePermission(perm)"
          />
          <span class="employee-create-form__permission-label">
            {{ permissionLabels[perm] }}
          </span>
        </label>
      }
    </div>
  </div>

  <div class="employee-create-form__actions">
    <button
      type="button"
      class="employee-create-form__submit"
      [disabled]="loading"
      (click)="submitCreate.emit()"
    >
      @if (loading) {
        Creando...
      } @else {
        Crear empleado
      }
    </button>
  </div>
</section>
